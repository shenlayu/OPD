# One config for native vOPD, full-vocabulary OPD, and our dense JSD features.
# Native vOPD: dense_objective=upstream, distill_mode=tml, use_baseline=true.
# Vanilla OPD: same, use_baseline=false. Full OPD: distill_mode=gkd_rkl.
# JSD: dense_objective=progressive_jsd, distill_mode=gkd_rkl, use_baseline=false.
# alpha_schedule: linear | teacher_entropy; fixed FKL/JSD/RKL: alpha_start=alpha_end.
# run_name/output_dir are assigned by the launcher; paths are relative to OPD_lite.
# Defaults match the historical Qwen 1.7B linear-JSD training/evaluation protocol.
run:
  dataset: dapo14k
  gpus:
  - 0
  - 1
  - 2
  - 3
  python: null
  threads: 4
  output_root: outputs
training:
  dataset_name: data/dapo14k
  train_split: train
  eval_split: null
  max_train_samples: null
  max_eval_samples: 20
  use_chat_template: false
  model_name_or_path: model/Qwen3-1.7B-Base
  teacher_model_name_or_path: model/Qwen3-1.7B
  distill_mode: gkd_rkl
  output_dir: null
  resume_from_checkpoint: null
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 1.0e-05
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: cosine
  num_generations: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  max_prompt_length: 1024
  max_completion_length: 2048
  temperature: 1.0
  kd_temperature: 1.0
  top_p: 1.0
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  logging_steps: 1
  log_grad_variance: false
  grad_variance_logging_steps: 1
  save_steps: 50
  eval_steps: 20
  save_total_limit: 2
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  beta: 0.0
  gamma: null
  reward_clip_lambda: null
  use_baseline: false
  kl_top_k: -1
  opd_top_k: -1
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.25
  vllm_tensor_parallel_size: 1
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  report_to: none
  wandb_project: OPD_TRL
  run_name: null
  seed: 42
  dense_objective: progressive_jsd
  alpha_start: 0.0
  alpha_end: 1.0
  alpha_schedule: linear
  loss_token_chunk_size: 128
  expected_initial_adapter_sha256: null
  max_grad_norm: 1.0
  enable_thinking: false
  repetition_penalty: 1.0
evaluation:
  enabled: true
  datasets:
  - name: math500
    path: data/math500/test.parquet
    split: test
    samples: 8
    limit: null
  - name: minerva
    path: data/minerva/test.parquet
    split: test
    samples: 8
    limit: null
  - name: amc23
    path: data/amc23/test.parquet
    split: test
    samples: 32
    limit: null
  - name: aime24
    path: data/aime24/test.parquet
    split: test
    samples: 32
    limit: null
  - name: aime25
    path: data/aime25/test.parquet
    split: test
    samples: 32
    limit: null
  prompt_style: plain_math
  enable_thinking: false
  max_prompt_length: 1024
  max_new_tokens: 4096
  max_model_len: 5120
  temperature: 0.6
  top_p: 0.9
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.8
  batch_size: 128
  max_num_batched_tokens: 8192
  enforce_eager: false
  seed: 42
  # engine: original vOPD n=samples RNG; per_sample: independent request seeds.
  seed_mode: engine
  seed_task_stride: 100000
  seed_example_stride: 32
  # model_eos follows historical vOPD; registered_special follows rethinking.
  stop_mode: model_eos
  grading_timeout: 10.0
